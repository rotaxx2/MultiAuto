databases:
  - name: multiauto-postgres
    databaseName: multiauto
    user: multiauto
    plan: free

services:
  - name: multiauto-redis
    type: keyvalue
    plan: free
    ipAllowList: []

  - name: multiauto-backend
    type: web
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health/
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: multiauto-postgres
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: keyvalue
          name: multiauto-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: keyvalue
          name: multiauto-redis
          property: connectionString
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        sync: false
      - key: TELEGRAM_MINI_APP_URL
        sync: false
      - key: TELEGRAM_DEFAULT_ORGANIZATION_SLUG
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: SECURE_SSL_REDIRECT
        value: "True"
      - key: SECURE_HSTS_SECONDS
        value: "31536000"
      - key: SECURE_HSTS_INCLUDE_SUBDOMAINS
        value: "True"
      - key: SECURE_HSTS_PRELOAD
        value: "True"
      - key: RUN_MIGRATIONS
        value: "true"
      - key: RUN_COLLECTSTATIC
        value: "true"
      - key: CELERY_BOOKING_REMINDER_RETRY_COUNTDOWN
        value: "60"
      - key: CELERY_BOOKING_REMINDER_MAX_RETRIES
        value: "3"
      - key: CELERY_WORKER_PREFETCH_MULTIPLIER
        value: "1"
      - key: BOOKING_REMINDER_POLL_SECONDS
        value: "300"
      - key: BOOKING_STATUS_SWEEP_SECONDS
        value: "300"
      - key: WEB_CONCURRENCY
        value: "2"

  - name: multiauto-mini-app
    type: web
    runtime: static
    buildCommand: cd frontend && pnpm install --frozen-lockfile && pnpm build
    staticPublishPath: ./frontend/dist
    pullRequestPreviewsEnabled: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
