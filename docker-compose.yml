x-backend-env: &backend-env
  DJANGO_SETTINGS_MODULE: config.settings.production
  SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in your environment or .env file}
  DEBUG: "False"
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
  DATABASE_URL: postgres://${POSTGRES_USER:-multiauto}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment or .env file}@postgres:5432/${POSTGRES_DB:-multiauto}
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/0
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
  TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
  TELEGRAM_MINI_APP_URL: ${TELEGRAM_MINI_APP_URL:-http://localhost:5173}
  TELEGRAM_DEFAULT_ORGANIZATION_SLUG: ${TELEGRAM_DEFAULT_ORGANIZATION_SLUG:-}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
  CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
  SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-False}
  SECURE_HSTS_SECONDS: ${SECURE_HSTS_SECONDS:-0}
  SECURE_HSTS_INCLUDE_SUBDOMAINS: ${SECURE_HSTS_INCLUDE_SUBDOMAINS:-False}
  SECURE_HSTS_PRELOAD: ${SECURE_HSTS_PRELOAD:-False}
  CELERY_BOOKING_REMINDER_RETRY_COUNTDOWN: ${CELERY_BOOKING_REMINDER_RETRY_COUNTDOWN:-60}
  CELERY_BOOKING_REMINDER_MAX_RETRIES: ${CELERY_BOOKING_REMINDER_MAX_RETRIES:-3}
  CELERY_WORKER_PREFETCH_MULTIPLIER: ${CELERY_WORKER_PREFETCH_MULTIPLIER:-1}
  WEB_CONCURRENCY: ${WEB_CONCURRENCY:-3}

x-frontend-env: &frontend-env
  VITE_API_URL: ${VITE_API_URL:-}
  VITE_DEV_PROXY_TARGET: http://backend:8000

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: /app/backend/start-web.sh
    environment:
      <<: *backend-env
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      RUN_COLLECTSTATIC: ${RUN_COLLECTSTATIC:-true}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - backend_media:/app/backend/media
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/', timeout=3).read()\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  celery_worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: celery -A config worker -l info
    environment:
      <<: *backend-env
      RUN_MIGRATIONS: "false"
      RUN_COLLECTSTATIC: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$(hostname) --timeout=3 | grep -q pong"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  celery_beat:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: celery -A config beat -l info --pidfile=
    environment:
      <<: *backend-env
      RUN_MIGRATIONS: "false"
      RUN_COLLECTSTATIC: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  telegram_bot:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: python manage.py run_telegram_bot
    environment:
      <<: *backend-env
      RUN_MIGRATIONS: "false"
      RUN_COLLECTSTATIC: "false"
    depends_on:
      backend:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "corepack enable && pnpm install --frozen-lockfile && pnpm dev --host 0.0.0.0"
    environment:
      <<: *frontend-env
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-multiauto}
      POSTGRES_USER: ${POSTGRES_USER:-multiauto}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment or .env file}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-multiauto} -d ${POSTGRES_DB:-multiauto}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
  redis_data:
  backend_media:
  frontend_node_modules:
